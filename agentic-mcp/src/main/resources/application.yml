spring:
  application:
    name: DPOMBaseMCPServer
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: DPOMBaseMCPServer
        version: 0.0.1
        type: SYNC
        sse-message-endpoint: /mcp/messages
        sse-endpoint: /sse
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

dpom:
  mcp:
    write-tools-enabled: false

apm:
  discovery-cache:
    ttl: 1d
    maximum-size: 1000

ces:
  discovery-cache:
    ttl: 1d
    maximum-size: 2000

aom:
  discovery-cache:
    ttl: 1h
    maximum-size: 2000

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,huaweiCloudCredentials
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}

huaweicloud:
  region: cn-southwest-2
  ak: ${HUAWEICLOUD_AK:}
  sk: ${HUAWEICLOUD_SK:}
  project-id: ${HUAWEICLOUD_PROJECT_ID:}
  apm-region: ${HUAWEICLOUD_APM_REGION:cn-north-4}
  apm-business-id: ${HUAWEICLOUD_APM_BUSINESS_ID:}
  lts-region: ${HUAWEICLOUD_LTS_REGION:cn-north-9}

logging:
  level:
    root: INFO
    com.huawei.smartom.agentic: INFO
    org.springframework.ai: INFO

resilience4j:
  ratelimiter:
    instances:
      ces-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      ces-write:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0
      aom-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      apm-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 1500ms
      lts-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
  retry:
    instances:
      huaweicloud-retryable:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 4
