spring:
  application:
    name: DPOMBaseMCPServer
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: DPOMBaseMCPServer
        version: 0.0.1
        type: SYNC
        sse-message-endpoint: /mcp/messages
        sse-endpoint: /sse
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

dpom:
  diagnostic-report:
    generation-enabled: ${DPOM_DIAGNOSTIC_REPORT_GENERATION_ENABLED:false}
    read-api-enabled: ${DPOM_DIAGNOSTIC_REPORT_READ_ENABLED:false}
    token: ${DPOM_DIAGNOSTIC_REPORT_TOKEN:}
  investigation:
    authority:
      enabled: ${DPOM_INVESTIGATION_AUTHORITY_ENABLED:false}
      authority-epoch: ${DPOM_AUTHORITY_EPOCH:}
      cutover-at: ${DPOM_AUTHORITY_CUTOVER_AT:}
      producer-identity: ${DPOM_KAFKA_PRODUCER_IDENTITY:}
      accepted-schemas: diagnosis-event/2.0,diagnosis-progress/1.0
      characterization-accepted: ${DPOM_CUTOVER_CHARACTERIZATION_ACCEPTED:false}
      data-compatibility-accepted: ${DPOM_CUTOVER_DATA_COMPATIBILITY_ACCEPTED:false}
      dual-path-parity-accepted: ${DPOM_CUTOVER_PARITY_ACCEPTED:false}
      rollback-accepted: ${DPOM_CUTOVER_ROLLBACK_ACCEPTED:false}
      retirement-criteria-recorded: ${DPOM_CUTOVER_RETIREMENT_RECORDED:false}
      dpom-agent-admission-stopped: ${DPOM_AGENT_ADMISSION_STOPPED:false}
      dpom-agent-drained-or-closed: ${DPOM_AGENT_DRAINED_OR_CLOSED:false}
    progress-api:
      enabled: ${DPOM_INVESTIGATION_PROGRESS_API_ENABLED:false}
      bearer-token: ${DPOM_INVESTIGATION_PROGRESS_API_TOKEN:}
      page-limit: 100
      max-clients: 100
      buffer-limit: 25
      connection-duration: 5m
      heartbeat-interval: 15s
      poll-interval: 1s
    publication:
      enabled: ${DPOM_INVESTIGATION_PUBLICATION_ENABLED:false}
      bootstrap-servers: ${DPOM_KAFKA_BOOTSTRAP_SERVERS:}
      producer-identity: ${DPOM_KAFKA_PRODUCER_IDENTITY:}
      worker-id: ${DPOM_KAFKA_WORKER_ID:}
      batch-size: 50
      max-attempts: 8
      max-age: 24h
      lease-duration: 30s
      initial-backoff: 1s
      max-backoff: 5m
      capacity: 10000
      acknowledgement-timeout: 10s
      poll-delay: 1s
    persistence:
      enabled: ${DPOM_INVESTIGATION_PERSISTENCE_ENABLED:false}
      jdbc-url: ${DPOM_DB_URL:}
      username: ${DPOM_DB_USERNAME:}
      password: ${DPOM_DB_PASSWORD:}
      driver-class-name: ${DPOM_DB_DRIVER:com.mysql.cj.jdbc.Driver}
      expected-schema-version: 1
  mcp:
    write-tools-enabled: false
  obs:
    enabled: ${DPOM_OBS_ENABLED:false}
    transfer-tools-enabled: ${DPOM_OBS_TRANSFER_TOOLS_ENABLED:false}
    automatic-storage-enabled: ${DPOM_OBS_AUTOMATIC_STORAGE_ENABLED:false}
    bucket: ${DPOM_OBS_BUCKET:}
    prefix: ${DPOM_OBS_PREFIX:}
    endpoint: ${DPOM_OBS_ENDPOINT:}
    kms-key-id: ${DPOM_OBS_KMS_KEY_ID:}
    service-code: ${DPOM_OBS_SERVICE_CODE:}
    max-bytes: ${DPOM_OBS_MAX_BYTES:1048576}

apm:
  discovery-cache:
    ttl: 1d
    maximum-size: 1000

ces:
  discovery-cache:
    ttl: 1d
    maximum-size: 2000

aom:
  discovery-cache:
    ttl: 1h
    maximum-size: 2000

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,huaweiCloudCredentials
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}

huaweicloud:
  region: ${HUAWEICLOUD_REGION:cn-north-9}
  ak: ${HUAWEICLOUD_AK:}
  sk: ${HUAWEICLOUD_SK:}
  project-id: ${HUAWEICLOUD_PROJECT_ID:}
  apm-region: ${HUAWEICLOUD_APM_REGION:cn-north-4}
  apm-business-id: ${HUAWEICLOUD_APM_BUSINESS_ID:}
  lts-region: ${HUAWEICLOUD_LTS_REGION:cn-north-9}

logging:
  level:
    root: INFO
    com.huawei.smartom.agentic: INFO
    org.springframework.ai: INFO

resilience4j:
  ratelimiter:
    instances:
      ces-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      ces-write:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0
      aom-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      apm-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 1500ms
      lts-readonly:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      obs-transfer:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0
  retry:
    instances:
      huaweicloud-retryable:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 4
